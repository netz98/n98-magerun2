---
name: Lint Code Base

#
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

on: [push, pull_request]

###############
# Set the Job #
###############
jobs:
  build:
    # Name the Job
    name: Lint Code Base
    # Set the agent to run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write

    ##################
    # Load all steps #
    ##################
    steps:
      ##########################
      # Checkout the code base #
      ##########################
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full git history is needed to get a proper list of changed files
          # within super-linter
          fetch-depth: 0
          persist-credentials: false

      - name: Remove files which should not be linted
        run: |
          rm -Rf tests/N98/Util/_files/sample-project/composer

      - name: Install Composer Dependencies (ignore platform requirements)
        run: composer install --ignore-platform-reqs

      ################################
      # Run Linter against code base #
      ################################
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854
        env:
          VALIDATE_ALL_CODEBASE: false
          # Super-Linter cannot mix true and false linter selections. Preserve
          # the pinned action's existing enabled checks and add Trivy explicitly.
          VALIDATE_ANSIBLE: true
          VALIDATE_ARM: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_CLANG_FORMAT: true
          VALIDATE_CLOUDFORMATION: true
          VALIDATE_CLOJURE: true
          VALIDATE_COFFEESCRIPT: true
          VALIDATE_CPP: true
          VALIDATE_CSHARP: true
          VALIDATE_DART: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_DOTNET_SLN_FORMAT_ANALYZERS: true
          VALIDATE_DOTNET_SLN_FORMAT_STYLE: true
          VALIDATE_DOTNET_SLN_FORMAT_WHITESPACE: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_GO: true
          VALIDATE_GO_MODULES: true
          VALIDATE_GO_RELEASER: true
          VALIDATE_GOOGLE_JAVA_FORMAT: true
          VALIDATE_GROOVY: true
          VALIDATE_HTML: true
          VALIDATE_JAVA: true
          VALIDATE_KOTLIN: true
          VALIDATE_KUBERNETES_KUBECONFORM: true
          VALIDATE_LATEX: true
          VALIDATE_LUA: true
          VALIDATE_MARKDOWN_PRETTIER: true
          VALIDATE_OPENAPI: true
          VALIDATE_PERL: true
          VALIDATE_PHP_BUILTIN: true
          VALIDATE_POWERSHELL: true
          VALIDATE_PRE_COMMIT: true
          VALIDATE_PROTOBUF: true
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_ISORT: true
          VALIDATE_PYTHON_MYPY: true
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_PYTHON_RUFF_FORMAT: true
          VALIDATE_R: true
          VALIDATE_RENOVATE: true
          VALIDATE_RUBY: true
          VALIDATE_RUST_2015: true
          VALIDATE_RUST_2018: true
          VALIDATE_RUST_2021: true
          VALIDATE_RUST_2024: true
          VALIDATE_RUST_CLIPPY: true
          VALIDATE_SCALAFMT: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_SNAKEMAKE_LINT: true
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          VALIDATE_SPELL_CODESPELL: true
          VALIDATE_STATES: true
          VALIDATE_SQLFLUFF: true
          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_TERRAFORM_TFLINT: true
          VALIDATE_TERRAGRUNT: true
          VALIDATE_TRIVY: true
          VALIDATE_XML: true
          VALIDATE_YAML: true
          MARKDOWN_CONFIG_FILE: '.markdown-lint.yml'
          DEFAULT_BRANCH: 'develop'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
